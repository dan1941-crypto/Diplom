project:
  name: "NIDS Traffic Analyzer"
  version: "0.1.0"

paths:
  models_dir: "models"
  data_dir: "data"
  default_pcap: "legacy_reference/test.pcapng"

capture:
  idle_timeout_sec: 15.0
  active_timeout_sec: 120.0
  max_flows: 50000
  batch_size: 64
  batch_interval_ms: 250

features:
  clip_max: 1000000000.0
  # Port buckets: well_known (0-1023), registered (1024-49151), dynamic (49152-65535)
  # Plus common service flags: http(80,8080), https(443,8443), dns(53), ssh(22), ftp(20,21), rdp(3389), smb(445)
  service_ports: [20, 21, 22, 23, 25, 53, 80, 110, 143, 443, 445, 3306, 3389, 8080, 8443]

model:
  hidden_dim: 256
  num_blocks: 3
  dropout: 0.2
  epochs: 25
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  focal_gamma: 2.0
  val_split: 0.15
  test_split: 0.15
  random_seed: 42

inference:
  suspicious_threshold: 0.45
  attack_threshold: 0.70
  onnx_filename: "nids_resnet.onnx"
  preprocessor_filename: "preprocessor.joblib"
  metadata_filename: "metadata.json"
